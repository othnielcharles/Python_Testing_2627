<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs Points Board | GUDLFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen p-4 sm:p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 space-y-6">
        <div class="flex items-center justify-between pb-4 border-b border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Clubs Points Board</h1>
                <p class="text-sm text-gray-500 mt-1">Public leaderboard of points available for each registered club</p>
            </div>
            <a href="{{ url_for('index') }}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-lg border border-indigo-200 transition-colors">
                ← Back to Home
            </a>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-gray-200 bg-gray-50 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <th class="py-3 px-4">Club Name</th>
                        <th class="py-3 px-4 text-right">Points Available</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-sm">
                    {% for club in clubs %}
                    <tr class="hover:bg-gray-50/50 transition-colors">
                        <td class="py-3.5 px-4 font-semibold text-gray-900">{{ club['name'] }}</td>
                        <td class="py-3.5 px-4 text-right">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                                {{ club['points'] }} points
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
