<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{competition['name']}} || GUDLFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-6">
        <div>
            <h2 class="text-xl font-bold text-gray-900">{{competition['name']}}</h2>
            <div class="mt-2 p-3 bg-gray-50 rounded-lg border border-gray-100 flex items-center justify-between text-sm">
                <span class="text-gray-500">Places available:</span>
                <span class="font-bold text-indigo-600">{{competition['numberOfPlaces']}}</span>
            </div>
        </div>

        <form action="/purchasePlaces" method="post" class="space-y-4">
            <input type="hidden" name="club" value="{{club['name']}}">
            <input type="hidden" name="competition" value="{{competition['name']}}">

            <div>
                <label for="places" class="block text-sm font-medium text-gray-700 mb-1">
                    How many places?
                </label>
                <input 
                    type="number" 
                    name="places" 
                    id="places" 
                    min="1" 
                    max="12" 
                    placeholder="e.g. 2" 
                    required 
                    class="w-full px-4 py-2.5 bg-white border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                />
                <p class="text-xs text-gray-500 mt-1">Rule: 1 place = 1 point. Maximum 12 places per competition.</p>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button 
                    type="submit" 
                    class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors text-center cursor-pointer"
                >
                    Book
                </button>
                <a 
                    href="{{ url_for('index') }}" 
                    class="px-4 py-2.5 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-medium rounded-lg transition-colors text-center"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</body>
</html>
